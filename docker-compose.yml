services:
  server:
    image: bhavin42/ai-demo:latest
    working_dir: /app/apps/server
    command: sh -c "bun run seed && bun run start"
    ports:
      - "3001:3001"
    volumes:
      - uploads_data:/app/apps/server/uploads
    env_file:
      - apps/server/.env
    depends_on:
      - mongo
      - valkey
      - qdrant
    networks:
      - ai-network
    restart: unless-stopped

  worker:
    image: bhavin42/ai-demo:latest
    working_dir: /app/apps/server
    command: bun run worker
    volumes:
      - uploads_data:/app/apps/server/uploads
    env_file:
      - apps/server/.env
    depends_on:
      - server
      - mongo
      - valkey
      - qdrant
    networks:
      - ai-network
    restart: unless-stopped

  pwa:
    image: bhavin42/ai-demo:latest
    working_dir: /app/apps/pwa
    command: bun run dev --host 0.0.0.0
    ports:
      - "5173:5173"
    env_file:
      - apps/pwa/.env
    depends_on:
      - server
    networks:
      - ai-network
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ai-network
    restart: unless-stopped

  valkey:
    image: valkey/valkey
    ports:
      - "6379:6379"
    networks:
      - ai-network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    networks:
      - ai-network
    restart: unless-stopped

networks:
  ai-network:
    driver: bridge

volumes:
  mongo_data:
  uploads_data:

